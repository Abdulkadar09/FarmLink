<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmLink - Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <h2>FarmLink Registration</h2>
  <form id="registerForm">
    <label>Full Name</label>
    <input type="text" id="full_name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Password</label>
    <input type="password" id="password" required minlength="6">

    <label>Phone Number</label>
    <input type="text" id="phone_no" required>

    <label>Register as</label>
    <select id="role" onchange="toggleProfileFields()">
      <option value="Farmer">Farmer</option>
      <option value="Buyer">Buyer</option>
    </select>

    <!-- Farmer-only fields -->
    <div id="farmerFields">
      <label>Farm Location (address)</label>
      <input type="text" id="farm_location">
    </div>

    <!-- Buyer-only fields -->
    <div id="buyerFields" style="display:none;">
      <label>Business Type</label>
      <select id="business_type">
        <option value="Restaurant">Restaurant</option>
        <option value="Wholesaler">Wholesaler</option>
        <option value="Kirana Store">Kirana Store</option>
        <option value="Other">Other</option>
      </select>
      <label>Business Address</label>
      <input type="text" id="business_address">
    </div>

    <label>City</label>
    <input type="text" id="city">

    <label>State</label>
    <input type="text" id="state">

    <label>Pincode</label>
    <input type="text" id="pincode">

    <button type="submit">Register</button>
  </form>

  <div id="message" class="message"></div>

  <div class="link">Already have an account? <a href="login.html">Login here</a></div>
</div>

<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
