<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmLink - Farmer Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Page-specific overrides - dashboard needs to be wider than the auth forms */
  body { align-items: flex-start; }
  .container { width: 600px; margin: 30px auto; }
  .listing-card {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .listing-card .status {
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .status.Available { background: #e0f2e9; color: #2e7d32; }
  .status.Sold-Out { background: #fce4e4; color: #c62828; }
  .status.Expired { background: #eee; color: #777; }
  .mandi-hint { font-size: 13px; color: #555; margin-top: -8px; margin-bottom: 8px; }
  small.expire-btn { color: #c62828; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <h2>Welcome, <span id="farmerName">Farmer</span></h2>

  <h3>Add New Listing</h3>
  <form id="addCropForm">
    <label>Select Crop</label>
    <select id="crop_master_id" onchange="fetchMandiPrice()" required></select>
    <div class="mandi-hint" id="mandiHint"></div>

    <label>Quality Grade</label>
    <select id="quality_grade">
      <option value="Premium">Premium</option>
      <option value="Standard" selected>Standard</option>
      <option value="Basic">Basic</option>
    </select>

    <label>Total Quantity (kg)</label>
    <input type="number" id="total_quantity" required min="1">

    <label>Your Expected Price (per kg)</label>
    <input type="number" id="expected_price_per_kg" required min="1">

    <label>Harvest Date</label>
    <input type="date" id="harvest_date">

    <label>Location</label>
    <button type="button" onclick="captureLocation()">📍 Capture Current GPS Location</button>
    <div class="mandi-hint" id="locationStatus">Location not captured yet</div>

    <button type="submit">Add Listing</button>
  </form>

  <div id="message" class="message"></div>

  <h3 style="margin-top:30px;">My Listings</h3>
  <div id="listingsContainer">Loading...</div>
</div>

<script src="js/config.js"></script>
<script src="js/farmer-dashboard.js"></script>
</body>
</html>
